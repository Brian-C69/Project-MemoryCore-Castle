# The release: push a tag vX.Y.Z (after `npm run bump X.Y.Z` and a commit) and this builds the
# official, signed Windows installer (and, in a second job, the Mac .dmg), publishes the GitHub release every installed Castle reads,
# and tells the MemoryCore Foundation's site about it.
#
# The job runs in the `release` environment (repository settings > Environments): only a v*.*.*
# tag may use it. Before anyone else gets write access, add the owner as its required reviewer there,
# so nothing is signed without the owner's approval.
#
# Secrets (in the `release` environment, never at repository level):
#   TAURI_SIGNING_PRIVATE_KEY  the text of the private key made by `scripts/release.ps1 -Setup`
#   PORTFOLIO_RELEASE_TOKEN    optional - the site's release token; without it that step is skipped
# Variable (optional): PORTFOLIO_RELEASE_URL - where the release is sent (has a default)
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    environment: release
    env:
      PORTFOLIO_RELEASE_TOKEN: ${{ secrets.PORTFOLIO_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match package.json ($version). Run npm run bump first."
            exit 1
          fi

      - name: The signing key is there
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The secret TAURI_SIGNING_PRIVATE_KEY is missing - add the private key's text in the repository settings."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Official build
        env:
          CASTLE_OFFICIAL: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        shell: bash
        run: npx tauri build --features official --config src-tauri/tauri.official.conf.json

      - name: Release files
        run: node scripts/latest-json.mjs

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-out/*.exe release-out/*.sig release-out/latest.json \
            --title "MemoryCore Castle ${GITHUB_REF_NAME#v}" --notes-file release-out/notes.md

      - name: Tell the MemoryCore Foundation's site
        if: env.PORTFOLIO_RELEASE_TOKEN != ''
        continue-on-error: true
        env:
          PORTFOLIO_RELEASE_URL: ${{ vars.PORTFOLIO_RELEASE_URL }}
        run: node scripts/tell-portfolio.mjs

  # The Mac build, added to the same release once the Windows job has published it. Not signed by
  # Apple yet (macOS asks once: System Settings > Privacy & Security > Open Anyway) and without the
  # self-updater: Mac members update by downloading the new .dmg.
  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: node src-tauri/resources/tools/test-helpers.mjs
      - name: Mac build (Apple silicon and Intel in one app)
        run: npx tauri build --target universal-apple-darwin
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$dmg" "MemoryCore-Castle-${version}-macos.dmg"
          gh release upload "$GITHUB_REF_NAME" "MemoryCore-Castle-${version}-macos.dmg"

[package]
name = "memorycore-castle"
version = "0.1.0"
description = "MemoryCore Castle - a full-screen desktop for your MemoryCore companion"
authors = ["Kiyo Software TechLab"]
license = "MIT"
edition = "2021"

[lib]
name = "memorycore_castle_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"

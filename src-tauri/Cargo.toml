[package]
name = "memorycore-castle"
version = "0.1.0"
description = "MemoryCore Castle - a full-screen desktop for your MemoryCore companion"
authors = ["Kiyo Software TechLab"]
license = "MIT"
edition = "2021"

[lib]
name = "memorycore_castle_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# official release builds only (scripts/release.ps1): the signed self-updater
official = ["dep:tauri-plugin-updater"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
keyring = { version = "3", features = ["windows-native"] }
portable-pty = "0.9"
base64 = "0.22"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
arboard = "3.7"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tauri-plugin-updater = { version = "2", optional = true }
